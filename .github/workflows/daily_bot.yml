name: Daily Auto Jekyll Poster

on:
  schedule:
    # 매일 한국 시간 새벽 2시 (UTC 17:00) 자동 실행
    - cron: '0 17 * * *'
  workflow_dispatch: # 수동 즉시 실행 지원

jobs:
  write-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 깃허브 저장소에 글 파일을 저장할 권한 부여

    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4

      - name: Python 환경 세팅
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 라이브러리 설치
        run: |
          pip install google-genai

      - name: 글 자동 작성 스크립트 실행
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python auto_writer.py

      - name: 작성된 글 깃허브에 커밋 & 푸시
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add _posts/
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto: 새로운 환불 가이드 글 발행"
          git push
