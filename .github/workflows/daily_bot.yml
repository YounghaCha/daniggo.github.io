name: Daily Auto Jekyll Poster

on:
  schedule:
    # 매일 한국 시간 오전 11시 (UTC 02:00) 자동 실행
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  write-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4

      - name: Python 환경 세팅
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 필수 라이브러리 설치
        run: |
          pip install google-genai requests

      - name: 글 & 썸네일 자동 생성 스크립트 실행
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python auto_writer.py

      - name: 글과 이미지 깃허브에 커밋 & 푸시
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add _posts/ assets/images/
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto: 새로운 환불 가이드 글 및 썸네일 발행"
          git push
